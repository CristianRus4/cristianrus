<!-- TOOL PAGE: focus -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="A simple Pomodoro timer. 25-minute work sessions, 5-minute breaks.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://www.cristianrus.me/focus">
	<meta property="og:title" content="Focus — Cristian Rus">
	<meta property="og:description" content="A simple Pomodoro timer. 25-minute work sessions, 5-minute breaks.">
	<meta property="og:image" content="https://www.cristianrus.me/images/avatar.jpg">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="tools.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
    <title>focus</title>
</head>
<body>
    <h1 class="title"><a class="titlelink" href="/">Cristian Rus</a></h1>
    <p class="sub">design & human behaviour</p>
    <h1>focus</h1>
    <div class="pomodoro">
        <p class="phase" id="phase">focus</p>
        <div id="timer" class="timer">25:00</div>
        <div class="controls">
            <button type="button" id="toggle">play</button>
            <button type="button" id="next">skip</button>
            <button type="button" id="reset">reset</button>
        </div>
        <p class="tool-hint keys-hint">space to play or pause · s to skip · r to reset</p>
    </div>

    <script>
    (function () {
        // 25 min focus, 5 min break, a 15 min break after every fourth focus.
        const LENGTH = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
        const LABEL = { focus: 'focus', short: 'break', long: 'long break' };
        const $ = (id) => document.getElementById(id);

        let phase = 'focus';
        let done = 0;            // focus sessions finished
        let remaining = LENGTH.focus;
        let endsAt = null;       // timestamp while running; counting from it keeps time right in background tabs
        let ticker = null;
        let audio = null;

        const mmss = (secs) => {
            const s = Math.max(0, Math.ceil(secs));
            return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        };

        function render() {
            const left = endsAt ? (endsAt - Date.now()) / 1000 : remaining;
            $('timer').textContent = mmss(left);
            $('phase').textContent = phase === 'focus' ? 'focus · ' + (done % 4 + 1) + ' of 4' : LABEL[phase];
            $('toggle').textContent = endsAt ? 'pause' : 'play';
            document.title = endsAt ? mmss(left) + ' · ' + LABEL[phase] : 'focus';
        }

        // Two soft notes when a phase ends, and a notification if the tab is in the background.
        function signal() {
            if (audio) {
                [0, 0.18].forEach((delay, i) => {
                    const osc = audio.createOscillator();
                    const gain = audio.createGain();
                    osc.frequency.value = i ? 880 : 660;
                    gain.gain.setValueAtTime(0.0001, audio.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.2, audio.currentTime + delay + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + delay + 0.6);
                    osc.connect(gain).connect(audio.destination);
                    osc.start(audio.currentTime + delay);
                    osc.stop(audio.currentTime + delay + 0.65);
                });
            }
            if (document.hidden && window.Notification && Notification.permission === 'granted') {
                new Notification(phase === 'focus' ? 'Back to focus' : 'Time for a ' + LABEL[phase]);
            }
        }

        function advance() {
            if (phase === 'focus') {
                done++;
                phase = done % 4 === 0 ? 'long' : 'short';
            } else {
                phase = 'focus';
            }
            remaining = LENGTH[phase];
        }

        function tick() {
            if (endsAt - Date.now() <= 0) {
                advance();
                endsAt = Date.now() + remaining * 1000;   // the next phase starts on its own
                signal();
            }
            render();
        }

        function play() {
            // Sound and notifications need a click before they're allowed.
            if (!audio && window.AudioContext) audio = new AudioContext();
            if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
            endsAt = Date.now() + remaining * 1000;
            ticker = setInterval(tick, 250);
            render();
        }

        function pause() {
            remaining = Math.max(0, (endsAt - Date.now()) / 1000);
            endsAt = null;
            clearInterval(ticker);
            render();
        }

        const toggle = () => (endsAt ? pause() : play());
        function skip() { if (endsAt) pause(); advance(); render(); }
        function reset() { if (endsAt) pause(); phase = 'focus'; done = 0; remaining = LENGTH.focus; render(); }

        $('toggle').addEventListener('click', toggle);
        $('next').addEventListener('click', skip);
        $('reset').addEventListener('click', reset);
        document.addEventListener('keydown', (e) => {
            if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('button')) return;
            if (e.key === ' ') { e.preventDefault(); toggle(); }
            if (e.key === 's' || e.key === 'n') skip();
            if (e.key === 'r') reset();
        });

        render();
    })();
    </script>
</body>
</html>
