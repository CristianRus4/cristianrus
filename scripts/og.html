<!DOCTYPE html>
<!-- Source of /og.png, the one social preview image every page shares (1200 by 630),
     in the classic style.css look. Render it with scripts/og.sh after changing it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
	font-family: 'Geist';
	src: url('../fonts/GeistVariableVF.woff2') format('woff2');
	font-weight: 100 900;
}
html, body {
	margin: 0;
	width: 1200px;
	height: 630px;
	overflow: hidden;
}
body {
	position: relative;
	background: #FDFDFC;
	color: #555555;
	font-family: 'Geist', sans-serif;
	-webkit-font-smoothing: antialiased;
}
/* Tagline and name on the leading edge, sitting on the line below; avatar in the top trailing corner. */
.row {
	position: absolute;
	left: 96px;
	right: 96px;
	bottom: 132px;
	display: flex;
	justify-content: space-between;
	align-items: flex-end;
}
.meta {
	margin: 0 0 40px;
	font-size: 22px;
	font-weight: 650;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: #21201C;
}
h1 {
	margin: 0;
	font-size: 104px;
	font-weight: 650;
	line-height: 0.74;
	letter-spacing: -0.03em;
	color: #21201C;
}
.avatar {
	position: absolute;
	top: 96px;
	right: 96px;
	width: 128px;
	height: 128px;
	border-radius: 28px;
	object-fit: cover;
	display: block;
}
.rule {
	position: absolute;
	left: 96px;
	bottom: 98px;
	width: 132px;
	height: 6px;
	background: #21201C;
}
.url {
	position: absolute;
	right: 96px;
	bottom: 86px;
	margin: 0;
	font-size: 26px;
	font-weight: 400;
	color: #21201C;
}
</style>
</head>
<body>
	<div class="row">
		<div>
			<p class="meta">Design &amp; Human Behaviour</p>
			<h1>Cristian</h1>
		</div>
	</div>
	<img class="avatar" src="../images/avatar.jpg" alt="">
	<div class="rule"></div>
	<p class="url">cristianrus.me</p>
</body>
</html>
