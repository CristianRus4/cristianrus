<!DOCTYPE html>
<!-- Source of /og.png, the one social preview image every page shares (1200 by 630),
     in the classic style.css look. Render it with scripts/og.sh after changing it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
	font-family: 'Geist';
	src: url('../fonts/GeistVariableVF.woff2') format('woff2');
	font-weight: 100 900;
}
html, body {
	margin: 0;
	width: 1200px;
	height: 630px;
	overflow: hidden;
}
body {
	position: relative;
	background: #FDFDFC;
	color: #21201C;
	font-family: 'Geist', sans-serif;
	-webkit-font-smoothing: antialiased;
}
p, h1 { margin: 0; }
.meta {
	position: absolute;
	left: 96px;
	top: 96px;
	font-size: 22px;
	font-weight: 650;
	letter-spacing: 0.04em;
	text-transform: uppercase;
}
.url {
	position: absolute;
	left: 96px;
	top: 136px;
	font-size: 22px;
}
.avatar {
	position: absolute;
	top: 96px;
	right: 96px;
	width: 128px;
	height: 128px;
	border-radius: 28px;
	object-fit: cover;
	display: block;
	z-index: 1;   /* sits above the page: a hairline edge and a tight contact shadow */
	box-shadow: 0 0 0 1px rgba(33, 32, 28, 0.14), 0 2px 2px rgba(33, 32, 28, 0.10), 0 10px 14px -8px rgba(33, 32, 28, 0.45);
}
/* The name, so big it runs off the bottom and the trailing edge. */
.name {
	position: absolute;
	left: 80px;
	bottom: -46px;
	font-size: 334px;
	font-weight: 650;
	line-height: 0.74;
	letter-spacing: -0.055em;
	white-space: nowrap;
}
</style>
</head>
<body>
	<p class="meta">Design &amp; Human Behaviour</p>
	<p class="url">cristianrus.me</p>
	<img class="avatar" src="../images/avatar.jpg" alt="">
	<h1 class="name">Cristian</h1>
</body>
</html>
