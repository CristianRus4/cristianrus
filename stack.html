<script>
(function () {
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const letters = 'abcdefghijklmnopqrstuvwxyz';
  const cells = Array.from(document.querySelectorAll('#animated-table td'))
    .filter(cell => cell.textContent.trim());

  // Each row fades in on random letters, as if it might be something else, then settles on the one app.
  cells.forEach((cell, i) => {
    if (calm) { cell.classList.add('visible'); return; }
    const name = cell.textContent;
    const scramble = setInterval(() => {
      cell.textContent = name.replace(/\S/g, ch => {
        const r = letters[Math.floor(Math.random() * letters.length)];
        return ch === ch.toUpperCase() ? r.toUpperCase() : r;
      });
    }, 50);
    setTimeout(() => cell.classList.add('visible'), i * 300);
    setTimeout(() => { clearInterval(scramble); cell.textContent = name; }, i * 300 + 700);
  });
})();
</script>
