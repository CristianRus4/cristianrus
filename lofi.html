<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Lofi music player. Press play.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://www.cristianrus.me/lofi">
	<meta property="og:title" content="Lofi — Cristian Rus">
	<meta property="og:description" content="Lofi music player. Press play.">
	<meta property="og:image" content="https://www.cristianrus.me/og.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Cristian, design and human behaviour">

	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="tools.css">
	<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
	<title>lofi</title>
</head>
<body>

	<button id="playButton" type="button" aria-label="Play" disabled>
  <span id="playIcon"><svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 3 L19 12 L5 21 Z"></path>
</svg></span>
  <span id="pauseIcon" hidden><svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="4" width="4" height="16" rx="2" ry="2"></rect>
  <rect x="14" y="4" width="4" height="16" rx="2" ry="2"></rect>
</svg>
</span>
</button>

  <div id="player"></div>

  <script>
    // Lofi Girl's live radio, played through a hidden YouTube player.
    // The icon follows what the player is actually doing.
    var player;
    var button = document.getElementById('playButton');

    function show(playing) {
      document.getElementById('playIcon').hidden = playing;
      document.getElementById('pauseIcon').hidden = !playing;
      button.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      document.title = playing ? '♪ lofi' : 'lofi';
    }

    function toggle() {
      if (!player || button.disabled) return;
      var state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) player.pauseVideo();
      else player.playVideo();
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: 'jfKfPfyJRdk',
        events: {
          onReady: function () {
            button.disabled = false;
            show(false);
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING) show(true);
            else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) show(false);
          },
          onError: function () {
            show(false);
          }
        }
      });
    }

    button.addEventListener('click', toggle);
    document.addEventListener('keydown', function (e) {
      if (e.key === ' ' && e.target !== button) { e.preventDefault(); toggle(); }
    });
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>

</body>

</html>
