<!DOCTYPE html>
<html lang="en" style="--paper:#1F5F78; --ink:#F2EAD8">
	<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#1F5F78" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)">
	<meta name="description" content="What Cristian is up to right now — music, books, movies, and code.">
	<link rel="canonical" href="https://www.cristianrus.me/now">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://www.cristianrus.me/now">
	<meta property="og:title" content="Now — Cristian Rus">
	<meta property="og:description" content="What Cristian is up to right now — music, books, movies, and code.">
	<meta property="og:image" content="https://www.cristianrus.me/og.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Cristian Rus, designer and independent developer in New Zealand">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="preload" href="fonts/GeistVariableVF.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="swissstyle.css">
	<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
	<title>Now — Cristian Rus</title>
	</head>

	<body>


		<main class="page-head bottom-head">
			<div class="bottom-content">
				<table id="animated-table">
				  <tr>
				    <th scope="row">age</th>
				    <td><span id="counter"></span></td>
				  </tr>
				  <tr>
				    <th scope="row">location</th>
				    <td><span id="location">Wellington, NZ</span></td>
				  </tr>
				  <tr>
				    <th scope="row">conditions</th>
				    <td id="weather-info"></td>
				  </tr>
				  <tr aria-hidden="true">
				    <th><br></th>
				    <td></td>
				  </tr>
				  <tr>
				    <th scope="row">workout</th>
				    <td id="workout-info"></td>
				  </tr>
				  <tr>
				    <th scope="row">obsessed</th>
				    <td id="top-song"></td>
				  </tr>
				  <tr>
				    <th scope="row">watched</th>
				    <td id="last-movie"></td>
				  </tr>
				  <tr>
				    <th scope="row">read</th>
				    <td id="last-book"></td>
				  </tr>
				</table>
			</div>
			<div class="bottom-title-row">
				<h1 class="title"><a class="titlelink" href="/">Now</a></h1>
				<p class="sub" id="current-time"></p>
			</div>
		</main>

<script>
(function () {
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const pageStart = Date.now();

  // A row whose source failed or is out of date disappears rather than showing a blank or stale value.
  function hideRow(el) {
    const row = el && el.closest('tr');
    if (row) row.hidden = true;
  }

  function scrambleText(el, finalText, duration = 700) {
    if (calm) { el.textContent = finalText; return; }
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const start = Date.now();
    const timer = setInterval(() => {
      if (Date.now() - start >= duration) {
        clearInterval(timer);
        el.textContent = finalText;
        return;
      }
      el.textContent = finalText.replace(/[A-Z0-9]/gi, () => chars[Math.floor(Math.random() * chars.length)]);
    }, 50);
  }

  // Clock in the vertical subtitle.
  function renderCurrentTime() {
    const text = new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();
    scrambleText($('current-time'), text);
  }
  renderCurrentTime();
  setInterval(renderCurrentTime, 60000);

  // Age in years, to nine decimals, once per frame.
  const birth = new Date(1994, 3, 22, 16, 4, 4).getTime();
  const counter = $('counter');
  (function tick() {
    counter.textContent = ((Date.now() - birth) / 31557600000).toFixed(9);
    requestAnimationFrame(tick);
  })();

  // Fade the values in one row at a time.
  const revealAt = new Map();
  Array.from(document.querySelectorAll('#animated-table tr'))
    .filter(row => row.querySelector('th').textContent.trim())
    .map(row => row.querySelector('td'))
    .forEach((cell, i) => {
      revealAt.set(cell, calm ? 0 : i * 300);
      setTimeout(() => cell.classList.add('visible'), revealAt.get(cell));
    });

  // Every value shows random letters until its data is in. It keeps going for
  // at least SETTLE_AFTER ms once its row has faded in, so it never just flashes.
  const SETTLE_AFTER = 700;
  const letters = 'abcdefghijklmnopqrstuvwxyz';
  const scrambling = new Map();

  function scramble(el, length) {
    if (calm) return;
    const tick = () => {
      let s = '';
      for (let i = 0; i < length; i++) s += letters[Math.floor(Math.random() * letters.length)];
      el.textContent = s.charAt(0).toUpperCase() + s.slice(1);
    };
    tick();
    scrambling.set(el, setInterval(tick, 50));
  }

  // Stop the letters and show the real value. With nothing to show, the row
  // goes straight away (usually before it has even faded in).
  function settle(el, render) {
    const done = () => {
      clearInterval(scrambling.get(el));
      scrambling.delete(el);
      if (render) render(el);
      else hideRow(el);
    };
    if (!render || calm) return done();
    setTimeout(done, Math.max(0, pageStart + revealAt.get(el.closest('td')) + SETTLE_AFTER - Date.now()));
  }

  // Location is already in the HTML; it just gets the letters treatment.
  const place = $('location').textContent;
  scramble($('location'), 13);
  settle($('location'), el => { el.textContent = place; });

  [['weather-info', 16], ['workout-info', 18], ['top-song', 10], ['last-movie', 12], ['last-book', 20]]
    .forEach(([id, length]) => scramble($(id), length));

  // Weather (OpenWeatherMap).
  fetch('https://api.openweathermap.org/data/2.5/weather?q=Wellington,nz&units=metric&appid=1def22ce2b0dcb06bec08ed98beda671')
    .then(r => r.json())
    .then(data => {
      const text = `${data.weather[0].description} and ${Math.floor(data.main.temp)}°C`;
      settle($('weather-info'), el => { el.textContent = text; });
    })
    .catch(err => { console.error('Weather:', err); settle($('weather-info')); });

  // Latest workout (Nexus / Apple Health snapshot).
  const nzToday = new Intl.DateTimeFormat('en-CA', { timeZone: 'Pacific/Auckland' }).format(new Date());
  const daysAgo = (day) => Math.round((Date.parse(nzToday) - Date.parse(day)) / 86400000);
  fetch('now-active.json?t=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      // Only workouts from the last two weeks count as "now".
      const w = data.workout;
      const ago = w && w.date ? daysAgo(w.date) : NaN;
      const recent = w && w.name && ago >= 0 && ago <= 14;
      settle($('workout-info'), recent ? el => { el.textContent = w.durationMin ? `${w.name} · ${w.durationMin} min` : w.name; } : null);
    })
    .catch(err => {
      console.error('Nexus (now):', err);
      settle($('workout-info'));
    });

  // Most played artist this week (Last.fm).
  const weekAgo = Math.floor((Date.now() - 7 * 86400000) / 1000);
  fetch(`https://ws.audioscrobbler.com/2.0/?method=user.gettoptracks&user=cristianrus4&api_key=b1181111f4966c86cd00c3ef5fc59a55&format=json&limit=1&from=${weekAgo}`)
    .then(r => r.json())
    .then(data => {
      const track = data && data.toptracks && data.toptracks.track && data.toptracks.track[0];
      if (!track) throw new Error('no top track this week');
      settle($('top-song'), el => { el.textContent = track.artist.name; });
    })
    .catch(err => { console.error('Last.fm:', err); settle($('top-song')); });

  const rss = (feed) => fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed) + '&cacheBuster=' + Date.now())
    .then(r => r.json())
    .then(data => {
      if (!data.items || !data.items.length) throw new Error('empty feed');
      return data.items;
    });

  // Last film logged (Letterboxd).
  rss('https://letterboxd.com/cristianrus4/rss/')
    .then(items => {
      const film = items[0].title.replace(/\s+-\s+★.*$/, '').trim();
      settle($('last-movie'), el => { el.textContent = film; });
    })
    .catch(err => { console.error('Letterboxd:', err); settle($('last-movie')); });

  // Current book: the newest entry without a "read at" date, else the latest read (Goodreads).
  rss('https://www.goodreads.com/review/list_rss/74821928?key=camdfkmNuO8PqylPKlVe_AckSkL5KnbljWIRS8Dd_HO_Nq_m&shelf=read&sort=date_added')
    .then(items => {
      const book = items.find(item => {
        const readAt = item.description.match(/read at:\s*(.*?)<br/);
        return !readAt || readAt[1].trim() === '';
      }) || items[0];
      const authorMatch = book.description.match(/author:\s*(.*?)<br/);
      const author = authorMatch ? new DOMParser().parseFromString(authorMatch[1], 'text/html').body.textContent.trim() : '';
      settle($('last-book'), cell => {
        const title = document.createElement('em');
        title.textContent = book.title;
        cell.replaceChildren(title);
        if (author) cell.append(' by ' + author);
        cell.title = author ? `${book.title} by ${author}` : book.title;
      });
    })
    .catch(err => { console.error('Goodreads:', err); settle($('last-book')); });
})();
</script>

	</body>
</html>
