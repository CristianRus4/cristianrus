<!-- TOOL PAGE: flip -->
<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Flip a coin. Heads or tails.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://www.cristianrus.me/flip">
	<meta property="og:title" content="Flip — Cristian Rus">
	<meta property="og:description" content="Flip a coin. Heads or tails.">
	<meta property="og:image" content="https://www.cristianrus.me/images/avatar.jpg">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="tools.css">
	<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
	<title>flip</title>
</head>
<body>

<main aria-live="polite">
  <span id="randomLetters"></span>
</main>
<p class="tool-hint flip-hint" id="tally"></p>

<script>
(function () {
  const el = document.getElementById('randomLetters');
  const tallyEl = document.getElementById('tally');
  const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_+=<>?';
  const sides = ['HEADS', 'TAILS'];
  const tally = { HEADS: 0, TAILS: 0 };
  let flipping = false;

  const side = () => sides[Math.floor(Math.random() * 2)];
  function noise() {
    if (Math.random() < 0.5) return side();
    let s = '';
    for (let i = 0; i < 5; i++) s += characters.charAt(Math.floor(Math.random() * characters.length));
    return s;
  }

  // Scramble fast, slow down, land. Tap, click or space to flip again.
  function flip() {
    if (flipping) return;
    flipping = true;
    tallyEl.style.visibility = 'hidden';
    const steps = 26;
    let i = 0;
    (function step() {
      if (i++ < steps) {
        el.textContent = noise();
        setTimeout(step, 30 + Math.pow(i / steps, 3) * 220);
        return;
      }
      const result = side();
      el.textContent = result;
      tally[result]++;
      tallyEl.textContent = `heads ${tally.HEADS} · tails ${tally.TAILS} — tap to flip again`;
      tallyEl.style.visibility = 'visible';
      flipping = false;
    })();
  }

  document.addEventListener('click', flip);
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  });
  flip();
})();
</script>

</body>
</html>
