	<body class="gallery-page">

		<header>
			<h1 class="title"><a class="titlelink" href="/">Cristian Rus</a></h1>
			<p class="sub">design & human behaviour</p>
		</header>

		<main data-gallery data-gallery-class="tattoo-viewer">

		<h1>tattoos</h1>

		<p>The different tattoos that you can find on my body. There is no reason for them to exist apart from satisfying my curiosity, giving me fun and some conversation topics in the future.</p>

		<ol class="tattoo-grid">
			<li>
				<figure id="aeropress" data-label="AeroPress · September 2018">
					<a class="tattoo-art" href="images/tattoos/aeropress.webp"><img src="images/tattoos/thumbs/aeropress.webp" width="900" height="900" alt="Line drawing of an AeroPress coffee maker" loading="lazy" decoding="async"></a>
					<figcaption>
						<h2>AeroPress</h2>
						<p class="tattoo-meta"><time datetime="2018-09">September 2018</time> · <em>So, you like coffee, huh?</em></p>
						<p data-story>It's my favorite coffee maker, it's the best coffee maker in the world. I love coffee, I love my AeroPress.</p>
					</figcaption>
				</figure>
			</li>
			<li>
				<figure id="rothko" data-label="Rothko · May 2019">
					<a class="tattoo-art" href="images/tattoos/rothko.webp"><img src="images/tattoos/thumbs/rothko.webp" width="900" height="900" alt="Outline of a Rothko painting: two stacked soft-edged rectangles inside a frame" loading="lazy" decoding="async"></a>
					<figcaption>
						<h2>Rothko</h2>
						<p class="tattoo-meta"><time datetime="2019-05">May 2019</time> · <em>Rothko always in my heart, also in my wrist</em></p>
						<p data-story>Rothko has always intrigued me, as an artist and as a person. His paintings arouse a fascination in me that no other artist achieves.</p>
					</figcaption>
				</figure>
			</li>
			<li>
				<figure id="dots" data-label="dots · March 2020">
					<a class="tattoo-art" href="images/tattoos/dots.webp"><img src="images/tattoos/thumbs/dots.webp" width="900" height="900" alt="Four tiny dots scattered on a blank square" loading="lazy" decoding="async"></a>
					<figcaption>
						<h2>dots</h2>
						<p class="tattoo-meta"><time datetime="2020-03">March 2020</time> · <em>Let's play a game</em></p>
						<p data-story>Four tiny random dots in my body. They mean absolutely nothing and aren't in special places either.</p>
					</figcaption>
				</figure>
			</li>
			<li>
				<figure id="beneath-hiraeth" data-label="beneath hiraeth · March 2020">
					<a class="tattoo-art" href="images/tattoos/beneath-hiraeth.webp"><img src="images/tattoos/thumbs/beneath-hiraeth.webp" width="900" height="900" alt="The words “beneath hiraeth” in lowercase lettering" loading="lazy" decoding="async"></a>
					<figcaption>
						<h2>beneath hiraeth</h2>
						<p class="tattoo-meta"><time datetime="2020-03">March 2020</time> · <em>The correct place</em></p>
						<p data-story>I've been searching for hiraeth all my life. I probably never reach that place because I will be always beneath it.</p>
					</figcaption>
				</figure>
			</li>
			<li>
				<figure id="decode-attitude" data-label="decode attitude · December 2020">
					<a class="tattoo-art" href="images/tattoos/decode-attitude.webp"><img src="images/tattoos/thumbs/decode-attitude.webp" width="900" height="900" alt="The words “decode attitude” in lowercase lettering" loading="lazy" decoding="async"></a>
					<figcaption>
						<h2>decode attitude</h2>
						<p class="tattoo-meta"><time datetime="2020-12">December 2020</time> · <em>The right way</em></p>
						<p data-story>Because this is a constant search for how to live and act.</p>
					</figcaption>
				</figure>
			</li>
			<li>
				<figure id="collapse" data-label="collapse · May 2021">
					<a class="tattoo-art" href="images/tattoos/collapse.webp"><img src="images/tattoos/thumbs/collapse.webp" width="900" height="900" alt="An abstract figure breaking apart into straight geometric lines" loading="lazy" decoding="async"></a>
					<figcaption>
						<h2>collapse</h2>
						<p class="tattoo-meta"><time datetime="2021-05">May 2021</time> · <em>Falling in chaos</em></p>
						<p data-story>A deconstruction of natural and artificial structures, an approach to the entropic spectrum.</p>
					</figcaption>
				</figure>
			</li>
			<li>
				<figure id="cntxt-nmttr" data-label="cntxt &amp; nmttr · January 2024">
					<a class="tattoo-art" href="images/tattoos/cntxt-nmttr.webp"><img src="images/tattoos/thumbs/cntxt-nmttr.webp" width="900" height="900" alt="The words “cntxt” and “nmttr” side by side in lowercase lettering" loading="lazy" decoding="async"></a>
					<figcaption>
						<h2>cntxt &amp; nmttr</h2>
						<p class="tattoo-meta"><time datetime="2024-01">January 2024</time> · <em>Get the context, nothing matters!</em></p>
						<p data-story>One side of me tries to get the context of everything. The other side knows that nothing matters.</p>
					</figcaption>
				</figure>
			</li>
		</ol>

		</main>

		<script src="gallery.js"></script>

	</body>
