name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fill in missing homescreen thumbnails
        continue-on-error: true
        run: |
          for f in images/homescreen/*.webp; do
            [ -f "images/homescreen/thumbs/$(basename "$f")" ] && continue
            command -v cwebp >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq webp; }
            sh scripts/homescreen-thumbs.sh
            break
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
