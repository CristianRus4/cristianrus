  <script type="text/javascript">

  // Copy the address instead of opening a mail app; fall back to mailto if the clipboard isn't available.
  const copyEmail = document.getElementById('copy-email');
  copyEmail.addEventListener('click', function(e) {
    if (!navigator.clipboard || !window.isSecureContext) return;
    e.preventDefault();
    navigator.clipboard.writeText('cristianrus@hey.com').then(() => {
      this.textContent = 'address copied';
      setTimeout(() => {
        this.textContent = 'mail';
      }, 1000);
    }, () => {
      location.href = this.href;
    });
  });
