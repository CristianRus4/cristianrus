<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Current time and date, displayed large.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://www.cristianrus.me/time">
	<meta property="og:title" content="Time — Cristian Rus">
	<meta property="og:description" content="Current time and date, displayed large.">
	<meta property="og:image" content="https://www.cristianrus.me/images/avatar.jpg">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="tools.css">
	<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
	<title>time</title>
	</head>

	<body>

    <div class="datee">
        <div id="date"></div>
    </div>
    <br>

    <div class="timee">
        <div id="time"></div>
    </div>

    <script type="text/javascript">
    (function () {
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        function ordinal(day) {
            if (day >= 11 && day <= 13) return 'th';
            return { 1: 'st', 2: 'nd', 3: 'rd' }[day % 10] || 'th';
        }

        function render() {
            const now = new Date();
            const hours = now.getHours() % 12 || 12;
            const time = hours + ':' + String(now.getMinutes()).padStart(2, '0') + ' ' + (now.getHours() >= 12 ? 'PM' : 'AM');
            document.getElementById('time').textContent = time;
            document.getElementById('date').textContent =
                days[now.getDay()] + ' ' + now.getDate() + ordinal(now.getDate()) + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
            document.title = time;
            // Next update right as the minute turns, not a minute after the page loaded.
            setTimeout(render, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 20);
        }

        render();
    })();
    </script>
</body>

</html>
