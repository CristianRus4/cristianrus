<!-- TOOL PAGE: think -->
<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="A random philosophy and life principle, one at a time.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://www.cristianrus.me/think">
	<meta property="og:title" content="Think — Cristian Rus">
	<meta property="og:description" content="A random philosophy and life principle, one at a time.">
	<meta property="og:image" content="https://www.cristianrus.me/images/avatar.jpg">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="tools.css">
	<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
	<title>think</title>
	</head>

	<body>

		<main class="value think" aria-live="polite">
			<p id="thought">There is always a way.</p>
		</main>
		<p class="tool-hint think-hint">tap for another</p>

		<script>
		(function () {
		  // The principles live on /attitude; this page shows one at a time.
		  const el = document.getElementById('thought');
		  let thoughts = [el.textContent];

		  function another() {
		    if (thoughts.length < 2) return;
		    let next;
		    do next = thoughts[Math.floor(Math.random() * thoughts.length)];
		    while (next === el.textContent);
		    el.classList.add('fade');
		    setTimeout(() => { el.textContent = next; el.classList.remove('fade'); }, 180);
		  }

		  fetch('attitude.html')
		    .then(r => r.text())
		    .then(html => {
		      const doc = new DOMParser().parseFromString(html, 'text/html');
		      const list = Array.from(doc.querySelectorAll('.item-list .item p'), p => p.textContent.trim()).filter(Boolean);
		      if (!list.length) return;
		      thoughts = list;
		      el.textContent = list[Math.floor(Math.random() * list.length)];
		    })
		    .catch(err => console.error('Attitude:', err));

		  document.addEventListener('click', another);
		  document.addEventListener('keydown', e => {
		    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); another(); }
		  });
		})();
		</script>

	</body>
</html>
