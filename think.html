<!-- TOOL PAGE: think -->
<!DOCTYPE html>
<html lang="en" style="--paper:#8A3A57; --ink:#F2EAD8">
	<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#8A3A57" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)">
	<meta name="description" content="A random philosophy and life principle, one at a time.">
	<link rel="canonical" href="https://www.cristianrus.me/think">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://www.cristianrus.me/think">
	<meta property="og:title" content="Think — Cristian Rus">
	<meta property="og:description" content="A random philosophy and life principle, one at a time.">
	<meta property="og:image" content="https://www.cristianrus.me/og.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Cristian, design and human behaviour">
	<meta name="twitter:card" content="summary_large_image">
	<link rel="preload" href="fonts/GeistVariableVF.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="swissstyle.css">
	<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
	<title>Think — Cristian Rus</title>
	</head>

	<body>

		<main class="page-head bottom-head">
			<div class="bottom-content think">
				<p class="think-line" id="thought" aria-live="polite">There is always a way.</p>
			</div>
			<div class="bottom-title-row">
				<p class="sub" id="think-kind"></p>
			</div>
		</main>

		<script>
		(function () {
		  // The principles live on /attitude (under "to know" and "to do"); this page shows one at a time.
		  const line = document.getElementById('thought');
		  const kind = document.getElementById('think-kind');
		  let thoughts = [{ text: line.textContent, kind: '' }];
		  let shown = null;
		  line.style.visibility = 'hidden';   // no flash of the fallback line before the real one

		  // Largest size at which the principle fits the width and about half the screen.
		  function fit(text) {
		    line.textContent = text;
		    let lo = 24, hi = Math.min(innerWidth * 0.2, 240);
		    for (let i = 0; i < 14; i++) {
		      const mid = (lo + hi) / 2;
		      line.style.fontSize = mid + 'px';
		      if (line.scrollWidth <= line.clientWidth + 1 && line.scrollHeight <= innerHeight * 0.55) lo = mid;
		      else hi = mid;
		    }
		    line.style.fontSize = lo + 'px';
		  }

		  function show(thought) {
		    shown = thought;
		    kind.textContent = thought.kind;
		    fit(thought.text);
		    line.style.visibility = '';
		  }

		  function another() {
		    if (thoughts.length < 2) return;
		    let next;
		    do next = thoughts[Math.floor(Math.random() * thoughts.length)];
		    while (next.text === shown.text);
		    show(next);
		  }

		  fetch('attitude.html')
		    .then(r => r.text())
		    .then(html => {
		      const doc = new DOMParser().parseFromString(html, 'text/html');
		      const list = [];
		      doc.querySelectorAll('.item-list').forEach(ul => {
		        const heading = ul.previousElementSibling && ul.previousElementSibling.matches('h2') ? ul.previousElementSibling.textContent.trim() : '';
		        ul.querySelectorAll('.item p').forEach(p => list.push({ text: p.textContent.trim(), kind: heading }));
		      });
		      if (list.length) thoughts = list;
		      show(thoughts[Math.floor(Math.random() * thoughts.length)]);
		    })
		    .catch(err => {
		      console.error('Attitude:', err);
		      show(thoughts[0]);
		    });

		  document.addEventListener('click', another);
		  document.addEventListener('keydown', e => {
		    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
		      e.preventDefault();
		      another();
		    }
		  });
		  addEventListener('resize', () => { if (shown) fit(shown.text); });
		})();
		</script>

	</body>
</html>
